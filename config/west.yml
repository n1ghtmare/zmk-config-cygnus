manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: n1ghtmare
      url-base: https://github.com/n1ghtmare
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    # Customized Prospector dongle display module, targeting ZMK v0.3 / Zephyr 3.5.
    - name: prospector-zmk-module
      remote: n1ghtmare
      revision: main
  self:
    path: config
