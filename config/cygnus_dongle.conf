# Dongle-only settings. Merged on top of config/cygnus.conf, which the dongle
# build also picks up (that is where the keyboard name lives).

# The dongle is USB powered and drives a display, so it should never sleep.
CONFIG_ZMK_SLEEP=n

# The beekeeb pre-soldered Prospector has no APDS9960 ambient light sensor,
# so drive the backlight at a fixed brightness instead (1-100).
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=31

# The Prospector adapter overlay declares the APDS9960 on i2c0 unconditionally,
# so Zephyr auto-enables its driver from devicetree even with the option above
# off. On this board the chip is not fitted, so the driver would probe an
# address nothing answers. Turn it off explicitly.
CONFIG_APDS9960=n

# Set to y if the display ends up upside down in your case.
CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=n

CONFIG_PROSPECTOR_LAYER_ROLLER_ALL_CAPS=n

# Show the active host Caps Lock state on the dongle.
CONFIG_ZMK_HID_INDICATORS=y
